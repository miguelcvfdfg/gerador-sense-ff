<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador do miguel de Sense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: radial-gradient(circle at top, #0f2027, #000);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
}

.app {
    width: 100%;
    max-width: 380px;
    background: rgba(20, 20, 20, 0.95);
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0,255,150,0.25);
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 24px;
    color: #00ff9d;
}

.header p {
    font-size: 14px;
    opacity: 0.7;
}

.card {
    background: linear-gradient(135deg, #111, #1c1c1c);
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

.label {
    font-size: 13px;
    opacity: 0.7;
}

.value {
    font-size: 22px;
    font-weight: bold;
    color: #00ff9d;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #00ff9d, #00c3ff);
    color: #000;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,255,150,0.4);
    transition: transform 0.2s;
}

button:active {
    transform: scale(0.95);
}

.footer {
    text-align: center;
    font-size: 12px;
    margin-top: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <h1>🎯 Gerador de Sense</h1>
        <p>gerador do miiguel</p>
    </div>

    <div class="card"><div class="label">Geral</div><div class="value" id="geral">---</div></div>
    <div class="card"><div class="label">Red Dot</div><div class="value" id="red">---</div></div>
    <div class="card"><div class="label">Mira 2x</div><div class="value" id="m2">---</div></div>
    <div class="card"><div class="label">Mira 4x</div><div class="value" id="m4">---</div></div>
    <div class="card"><div class="label">AWM</div><div class="value" id="awm">---</div></div>
    <div class="card"><div class="label">Olhar Livre</div><div class="value" id="olhar">---</div></div>

    <button onclick="gerar()">🔥 GERAR SENSE</button>

    <div class="footer">criador @xscmiguel</div>
</div>

<script>
function r(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function gerar() {
    document.getElementById("geral").innerText = r(90, 200);
    document.getElementById("red").innerText = r(80, 190);
    document.getElementById("m2").innerText = r(70, 180);
    document.getElementById("m4").innerText = r(60, 170);
    document.getElementById("awm").innerText = r(50, 160);
    document.getElementById("olhar").innerText = r(80, 200);
}
</script>

</body>
</html>
